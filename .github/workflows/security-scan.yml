name: Security scan

# Secrets (gitleaks) and dependencies (npm audit over every dependency, OSV-Scanner)
# on every push and pull request, plus the whole history every week and on demand.
# A finding fails the run: fix the code or upgrade, never the config
# (skills/secure-every-change/SKILL.md, skills/handle-a-secret-alert/SKILL.md).
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the commits to scan
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          opts=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            opts="$BEFORE..$SHA"
          elif [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ]; then
            opts="$BASE..$SHA"
          fi
          echo "log_opts=$opts" >> "$GITHUB_OUTPUT"
          echo "Scanning: ${opts:-the whole history}"

      - name: Install gitleaks (pinned, checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks
        shell: bash
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -euo pipefail
          args=(git . --config .gitleaks.toml --redact --no-banner --exit-code 1)
          if [ -n "$LOG_OPTS" ]; then args+=(--log-opts "$LOG_OPTS"); fi
          gitleaks "${args[@]}"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Development tools count too: a compromised build or test tool reaches the VSIX.
      - name: npm audit (all dependencies)
        run: npm audit --audit-level=moderate

      - name: OSV-Scanner (pinned, checksum verified)
        shell: bash
        env:
          OSV_VERSION: 2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile package-lock.json
