name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Gate and publish VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Require a new version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists. Increment package.json before every push to main."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Require committed release artifact
        env:
          ARTIFACT: builds/clawai-coding-agent-${{ steps.version.outputs.version }}.vsix
        shell: bash
        run: |
          if ! test -f "${ARTIFACT}"; then
            echo "::error::Commit ${ARTIFACT} before pushing main."
            exit 1
          fi
          git ls-files --error-unmatch "${ARTIFACT}" >/dev/null
          cp "${ARTIFACT}" "${RUNNER_TEMP}/committed-release.vsix"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify generated localization
        shell: bash
        run: |
          npm run l10n:build
          git diff --exit-code -- package.nls.json package.nls.*.json l10n

      - name: Run release checks
        run: npm run check

      - name: Run extension-host tests
        run: xvfb-run -a npm run test:host

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run webview end-to-end tests
        run: npm run test:playwright

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package VSIX
        run: npm run package

      - name: Verify release artifact
        env:
          ARTIFACT: builds/clawai-coding-agent-${{ steps.version.outputs.version }}.vsix
        shell: bash
        run: |
          test -f "${ARTIFACT}"
          mkdir -p "${RUNNER_TEMP}/committed-vsix" "${RUNNER_TEMP}/fresh-vsix"
          unzip -qq "${RUNNER_TEMP}/committed-release.vsix" -d "${RUNNER_TEMP}/committed-vsix"
          unzip -qq "${ARTIFACT}" -d "${RUNNER_TEMP}/fresh-vsix"
          diff -qr "${RUNNER_TEMP}/committed-vsix" "${RUNNER_TEMP}/fresh-vsix"

      - name: Build full release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q "^## ${VERSION}$" "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md has no release notes for ${VERSION}."
            exit 1
          fi
          cat >> "${RUNNER_TEMP}/release-notes.md" <<EOF

          ## Verified release

          - Quality, unit, integration, extension-host, browser, dependency, and packaging gates passed for commit \`${GITHUB_SHA}\`.
          - The attached VSIX was reproduced during this workflow and compared with the committed artifact before publication.

          ## Installation

          Download \`clawai-coding-agent-${VERSION}.vsix\`, run **Extensions: Install from VSIX...** in VS Code, select the file, and reload the window.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "builds/clawai-coding-agent-${{ steps.version.outputs.version }}.vsix" \
            --target "${GITHUB_SHA}" \
            --title "ClawAI Coding Agent ${{ steps.version.outputs.version }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
