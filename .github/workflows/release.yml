name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified VSIX
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists. Every main push must carry a fresh delivery minor."
            exit 1
          fi

      - name: Download final CI artifact
        uses: actions/download-artifact@v4
        with:
          name: clawai-coding-agent-release
          path: builds
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cd builds
          sha256sum -c "clawai-coding-agent-${VERSION}.vsix.sha256"
          sha256sum -c "clawai-coding-agent-${VERSION}.cdx.json.sha256"
          sha256sum -c "clawai-coding-agent-${VERSION}.spdx.json.sha256"
          sha256sum -c "clawai-coding-agent-${VERSION}.provenance.json.sha256"
          node --input-type=module - "${VERSION}" "${SOURCE_SHA}" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const [version, sourceSha] = process.argv.slice(2);
          const provenance = JSON.parse(
            await readFile(`clawai-coding-agent-${version}.provenance.json`, 'utf8'),
          );
          const source = provenance.predicate?.buildDefinition?.resolvedDependencies?.find(
            (dependency) => typeof dependency.digest?.gitCommit === 'string',
          );
          if (source?.digest?.gitCommit !== sourceSha) {
            throw new Error('Release provenance does not match the successful CI commit.');
          }
          NODE

      - name: Build full release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q "^## ${VERSION}$" "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md has no release notes for ${VERSION}."
            exit 1
          fi
          cat >> "${RUNNER_TEMP}/release-notes.md" <<EOF

          ## Verified release

          - All split CI gates passed for commit `${SOURCE_SHA}`.
          - The attached VSIX is the exact final artifact produced after every CI gate passed.
          - The same VSIX is published to the Visual Studio Marketplace.

          ## Installation

          Download `clawai-coding-agent-${VERSION}.vsix`, run **Extensions: Install from VSIX...** in VS Code, select the file, and reload the window.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "${TAG}"             builds/clawai-coding-agent-${VERSION}.*             --target "${SOURCE_SHA}"             --title "ClawAI Coding Agent ${VERSION}"             --notes-file "${RUNNER_TEMP}/release-notes.md"

      - name: Publish to the VS Code Marketplace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if test -z "${VSCE_PAT}"; then
            echo "::error::VSCE_PAT is required because every main release must reach the VS Code Marketplace."
            exit 1
          fi
          npx --yes @vscode/vsce publish             --packagePath "builds/clawai-coding-agent-${VERSION}.vsix"             --pat "${VSCE_PAT}"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          npx --yes ovsx publish             "builds/clawai-coding-agent-${VERSION}.vsix"             --pat "${OVSX_PAT}"
