name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify generated localization
        shell: bash
        run: |
          npm run l10n:build
          git diff --exit-code -- package.nls.json package.nls.*.json l10n

      - name: Run source checks
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Webview end-to-end tests
        run: npm run test:playwright

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package VSIX
        run: npm run package

      - name: Generate supply-chain evidence
        run: npm run supply-chain

      - uses: actions/upload-artifact@v4
        with:
          name: clawai-coding-agent-vsix
          path: 'builds/*.vsix'
          if-no-files-found: error

  extension-host:
    name: Extension host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Run VS Code extension-host tests
        run: xvfb-run -a npm run test:host
